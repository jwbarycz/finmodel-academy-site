<!doctype html>
<html lang="pl" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinModel Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="img/logo-mark.svg" type="image/svg+xml">
</head>
<body class="bare">
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Nawigacja">
      <a href="#/" class="sb-brand"><span class="logo" role="img" aria-label="Fundusz Hossa ProCapital"></span><span class="sb-app">FinModel Academy</span></a>
      <nav class="sb-nav" id="links"></nav>
      <div class="sb-progress" id="sbProgress"></div>
      <div class="sb-foot">
        <div id="user" class="sb-user"></div>
        <div class="sb-actions">
          <button id="theme" type="button" class="sb-btn">◐ Motyw</button>
          <button id="logout" type="button" class="sb-btn">Wyloguj</button>
        </div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button id="menuBtn" class="menu-btn" type="button" aria-label="Otwórz menu">☰</button>
        <div id="crumbs" class="tb-title"></div>
        <div id="stats" class="stats"></div>
      </header>
      <main id="app"></main>
      <footer>Wersja testowa · postępy zapisują się lokalnie w tej przeglądarce · Fundusz Hossa ProCapital</footer>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>
  <script src="js/sheet.js"></script>
  <script src="js/puzzles.js"></script>
  <script src="js/course.js"></script>
  <script src="js/cases.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
